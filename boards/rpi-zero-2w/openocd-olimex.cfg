# OpenOCD configuration: Olimex ARM-USB-OCD + Raspberry Pi 3 B / Zero 2 W (AArch64)
#
# Standalone OpenOCD equivalent of the Eclipse "GNU MCU OpenOCD (oli)" launch:
#   -f interface/ftdi/olimex-arm-usb-ocd.cfg -c "transport select jtag" \
#   -f board/rpi3.cfg
# Declarative: init and the run commands are issued by the driver script
# (run-openocd-olimex.sh / hw-olimex.sh) after this config is sourced.

source [find interface/ftdi/olimex-arm-usb-ocd.cfg]
transport select jtag
adapter speed 1000
source [find board/rpi3.cfg]

# Only core 0 gets a GDB server; cores 1-3 are driven from the same session.
bcm2837.cpu1 configure -gdb-port disabled
bcm2837.cpu2 configure -gdb-port disabled
bcm2837.cpu3 configure -gdb-port disabled
