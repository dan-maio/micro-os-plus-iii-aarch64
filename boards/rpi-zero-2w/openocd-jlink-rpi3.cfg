# OpenOCD configuration: SEGGER J-Link + Raspberry Pi Zero 2W (AArch64 kernel)
#
# Hardware debug via the SEGGER J-Link probe on JTAG.
#   - Interface: interface/jlink.cfg
#   - Target:    board/rpi3.cfg (BCM2837 = 4x Cortex-A53 as "aarch64" targets
#                with per-core CTI; these run the 64-bit kernel natively)
#
# This is the exact target setup the 64-bit zero2w reference project uses
# (Desktop ZERO_2W/64/cpp/zero2w/rpi3-jlink.cfg), plus GDB servers disabled on
# cores 1-3 like the 32b port. It is PURELY DECLARATIVE — no `init`, no `halt`
# here. hw.sh drives the session the canonical way:
#
#     openocd -f openocd-jlink-rpi3.cfg -c "init" -f <run-commands.cfg>
#
# so the halt / load_image / resume commands run strictly after init (the Pi has
# no SRST; reset_config is trst_only).
#
# Semihosting works natively on the aarch64 target ("arm semihosting enable"
# per core), unlike an AArch32 kernel on the same target.

source [find interface/jlink.cfg]
source [find board/rpi3.cfg]

# Only core 0 gets a GDB server; cores 1-3 are driven from the same session.
bcm2837.cpu1 configure -gdb-port disabled
bcm2837.cpu2 configure -gdb-port disabled
bcm2837.cpu3 configure -gdb-port disabled
