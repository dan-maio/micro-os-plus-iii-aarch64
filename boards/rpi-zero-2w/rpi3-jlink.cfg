# Custom OpenOCD config: Raspberry Pi 3 / Zero 2 W via SEGGER J-Link
#
# Mirrors the working Eclipse setup (NO SMP, independent cores) while keeping
# a single GDB server:
#   - load the J-Link interface and the rpi3 board config (4 cores)
#   - disable the GDB server on cores 1..3 so only core 0 is exposed to GDB
#     (avoids Cortex-Debug's contiguous port allocation colliding with the
#      secondary cores' gdb servers)

source [find interface/jlink.cfg]
source [find board/rpi3.cfg]

# Only core 0 gets a GDB server; cores 1..3 stay parked in the bootrom
bcm2837.cpu1 configure -gdb-port disabled
bcm2837.cpu2 configure -gdb-port disabled
bcm2837.cpu3 configure -gdb-port disabled
