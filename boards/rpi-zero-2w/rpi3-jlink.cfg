# Custom OpenOCD config: Raspberry Pi 3 / Zero 2 W via SEGGER J-Link
#
# Mirrors the working Eclipse setup (NO SMP, independent cores):
#   - load the J-Link interface and the rpi3 board config (4 cores)

source [find interface/jlink.cfg]
source [find board/rpi3.cfg]

# No GDB: OpenOCD alone halts, loads and resumes; the application talks
# through the UART and semihosting. Switching the server off also frees the
# 3333..3336 ports the four cores would otherwise take.
gdb port disabled
