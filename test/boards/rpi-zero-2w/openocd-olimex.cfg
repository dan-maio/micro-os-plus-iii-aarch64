# OpenOCD configuration: Olimex ARM-USB-OCD + Raspberry Pi 3 B / Zero 2 W (AArch64)
#
# Standalone OpenOCD equivalent of the Eclipse "GNU MCU OpenOCD (oli)" launch:
#   -f interface/ftdi/olimex-arm-usb-ocd.cfg -c "transport select jtag" \
#   -f board/rpi3.cfg
# Declarative: init and the run commands are issued by run-hw.sh after this
# config is sourced.

source [find interface/ftdi/olimex-arm-usb-ocd.cfg]
transport select jtag
adapter speed 1000
source [find board/rpi3.cfg]

# No GDB: OpenOCD alone halts, loads and resumes; the application talks
# through the UART and semihosting. Switching the server off also frees the
# 3333..3336 ports the four cores would otherwise take.
gdb port disabled
