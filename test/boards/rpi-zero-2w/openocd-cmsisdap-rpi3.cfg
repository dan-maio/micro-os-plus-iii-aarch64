# OpenOCD configuration: a CMSIS-DAP probe + Raspberry Pi Zero 2W (AArch64 kernel)
#
# Hardware debug on JTAG through any CMSIS-DAP probe (e.g. the Raspberry Pi
# Debug Probe, or a Pico running the debugprobe firmware).
#   - Interface: interface/cmsis-dap.cfg, switched to JTAG
#   - Target:    board/rpi3.cfg (BCM2837 = 4x Cortex-A53 as "aarch64" targets
#                with per-core CTI; these run the 64-bit kernel natively)
#
# The same settings as the hand-run commands
#
#     openocd -f interface/cmsis-dap.cfg -c "transport select jtag" \
#             -c "adapter speed 15000" -f board/rpi3.cfg -c init ...
#
# and, like openocd-jlink-rpi3.cfg, PURELY DECLARATIVE: no `init`, no `halt`
# here; hw.sh (PROBE=cmsis-dap) issues `init` and the run commands after it.
# With several CMSIS-DAP probes connected, select this board's with
# `adapter serial <serial>` (OpenOCD otherwise takes the first it finds).

source [find interface/cmsis-dap.cfg]
transport select jtag
adapter speed 15000
source [find board/rpi3.cfg]

# No GDB: OpenOCD alone halts, loads and resumes; the application talks
# through the UART and semihosting. Switching the server off also frees the
# 3333..3336 ports the four cores would otherwise take.
gdb port disabled
