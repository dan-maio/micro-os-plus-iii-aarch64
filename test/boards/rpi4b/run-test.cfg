# run-test.cfg — load one test into RAM and start it (what hw.sh -> run-hw.sh
# send, after the watchdog reset of reset.cfg and the boot wait).
#
#   openocd -s <this folder> -f openocd-cmsis-dap-rpi4b.cfg -c init \
#     -c "set ELF <test>-hwd" -f run-test.cfg
#
# Only core 0 is started at 0x80000; cores 1-3 are resumed where the firmware
# parked them (armstub8 spin table at 0xd8), and the test releases them
# itself. Stop OpenOCD with Ctrl-C after "RESULT: PASS".

targets bcm2711.cpu0; halt
rpi4b_enable_hde
targets bcm2711.cpu0; arm semihosting enable
targets bcm2711.cpu1; arm semihosting enable
targets bcm2711.cpu2; arm semihosting enable
targets bcm2711.cpu3; arm semihosting enable
targets bcm2711.cpu0; load_image $ELF
targets bcm2711.cpu0; reg pc 0x80000; reg pc; resume
