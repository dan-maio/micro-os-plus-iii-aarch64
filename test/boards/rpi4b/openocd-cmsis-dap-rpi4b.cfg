# OpenOCD configuration: CMSIS-DAP probe (Raspberry Pi Debug Probe,
# 2e8a:000c) over JTAG + Raspberry Pi 4 B (BCM2711, 4x Cortex-A72 as OpenOCD
# "aarch64" targets bcm2711.cpu0..3).
#
# The configuration the VS Code project (RPI4B/64/rpi4b/rpi4b-cmsis-dap.cfg)
# debugs this board with -- the user's command line
#
#     openocd -f interface/cmsis-dap.cfg -c "transport select jtag" -f board/rpi4b.cfg
#
# plus what a test session needs. PURELY DECLARATIVE: no init, no halt here.
# hw.sh -> run-hw.sh drive the session as
#
#     openocd -f openocd-cmsis-dap-rpi4b.cfg -c init -f <run-commands.cfg>
#
# JTAG on the 40-pin header (config.txt: enable_jtag_gpio=1, gpio=22-27=a4):
# TRST 22/15, RTCK 23/16, TDO 24/18, TCK 25/22, TDI 26/37, TMS 27/13.
#
# Speed: the probe's USB round trip (~9 ms per CMSIS-DAP command, ~54 ms per
# 32-bit debug access) is the limit, not TCK: 0.6 KB/s from 500 kHz to 8 MHz
# alike; 20 MHz fails. Loading a test therefore takes a minute or more.

source [find interface/cmsis-dap.cfg]
transport select jtag
source [find board/rpi4b.cfg]

adapter speed 4000

# No idle TCKs after each APB-AP access (OpenOCD's default is 10). The CMSIS-DAP
# JTAG backend sends every TCK as its own 2-byte DAP_JTAG_Sequence entry, so
# those 10 clocks took a third of each 64-byte USB packet, and each packet is a
# round trip of about 8 ms on this probe. Measured on the board: a 4 KB
# load_image took 6.7 s with the default and 3.9 s with 0, and the data read
# back identical.
# memaccess is refused before 'init', and every core's examine re-initialises
# the shared AP back to 10, so it is set again at the end of EVERY core's
# examine (examine-end events below), whichever core is examined last.

# No GDB: OpenOCD alone halts, loads and resumes; the application talks
# through the UART and semihosting. All four cores are examined at init
# (no -defer-examine): every one of them may print the verdict through
# semihosting, and a core whose semihosting is not enabled stalls at its
# first trap.
gdb port disabled

# ---------------------------------------------------------------------------
# Recover a core left in a broken debug state by a previous session.
#
# When the app ends with semihosting SYS_EXIT (HLT #0xF000) core 0 stays
# halted, and if OpenOCD is killed (Cortex-Debug stop, killall -9) in the
# middle of a DTR transfer the core keeps EDSCR.RXfull=1 / MA=1 / ERR=1.
# The next OpenOCD then gets "DSCR.ERR=1" on every instruction it sends,
# so it can neither read registers nor write the watchdog (no reset).
#
# Done through the APB-AP, before OpenOCD itself talks to the core:
#   1. EDRCR = CSE|CSPA      clear sticky error / pipeline advance
#   2. EDSCR.MA = 0          leave memory access mode
#   3. TXfull -> read DBGDTRTX_EL0 (external read drains it)
#   4. RXfull -> EDITR "mrs x0, dbgdtrrx_el0" (core consumes it, halted only)
#   5. EDRCR = CSE|CSPA again
# ---------------------------------------------------------------------------
proc rpi4b_unwedge {base} {
	set EDSCR  [expr {$base + 0x088}]
	set EDITR  [expr {$base + 0x084}]
	set DTRTX  [expr {$base + 0x08c}]
	set EDRCR  [expr {$base + 0x090}]

	if {[catch {set dscr [bcm2711.ap read_memory $EDSCR 32 1]}]} { return }
	bcm2711.ap write_memory $EDRCR 32 0xc
	if {$dscr & (1 << 20)} {
		bcm2711.ap write_memory $EDSCR 32 [expr {$dscr & ~(1 << 20)}]
	}
	if {$dscr & (1 << 29)} {
		bcm2711.ap read_memory $DTRTX 32 1
	}
	set status [expr {$dscr & 0x3f}]
	if {($dscr & (1 << 30)) && $status != 0x01 && $status != 0x02} {
		bcm2711.ap write_memory $EDITR 32 0xd5330500
		for {set i 0} {$i < 50} {incr i} {
			if {[bcm2711.ap read_memory $EDSCR 32 1] & (1 << 24)} { break }
		}
	}
	bcm2711.ap write_memory $EDRCR 32 0xc
	set after [bcm2711.ap read_memory $EDSCR 32 1]
	# report only real recoveries: ERR(6), MA(20), TXfull(29), RXfull(30)
	set bad [expr {(1 << 6) | (1 << 20) | (1 << 29) | (1 << 30)}]
	if {$dscr & $bad} {
		echo [format "rpi4b: core debug state recovered, EDSCR 0x%08x -> 0x%08x" $dscr $after]
	}
}

proc rpi4b_enable_core_hde {base} {
	set EDSCR [expr {$base + 0x088}]
	if {[catch {set dscr [bcm2711.ap read_memory $EDSCR 32 1]}] == 0} {
		if {!($dscr & (1 << 14))} {
			bcm2711.ap write_memory $EDSCR 32 [expr {$dscr | (1 << 14)}]
		}
	}
}

proc rpi4b_enable_hde {} {
	foreach base {0x80410000 0x80510000 0x80610000 0x80710000} {
		rpi4b_enable_core_hde $base
	}
}

bcm2711.cpu0 configure -event examine-start {rpi4b_unwedge 0x80410000}
bcm2711.cpu1 configure -event examine-start {rpi4b_unwedge 0x80510000}
bcm2711.cpu2 configure -event examine-start {rpi4b_unwedge 0x80610000}
bcm2711.cpu3 configure -event examine-start {rpi4b_unwedge 0x80710000}
bcm2711.cpu0 configure -event examine-end {bcm2711.dap memaccess 0; rpi4b_enable_core_hde 0x80410000}
bcm2711.cpu1 configure -event examine-end {bcm2711.dap memaccess 0; rpi4b_enable_core_hde 0x80510000}
bcm2711.cpu2 configure -event examine-end {bcm2711.dap memaccess 0; rpi4b_enable_core_hde 0x80610000}
bcm2711.cpu3 configure -event examine-end {bcm2711.dap memaccess 0; rpi4b_enable_core_hde 0x80710000}
