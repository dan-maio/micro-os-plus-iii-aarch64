# reset.cfg — reset the Pi 4 B through its PM watchdog, then exit.
#
#   openocd -s <this folder> -f openocd-cmsis-dap-rpi4b.cfg -c init -f reset.cfg
#   sleep 15
#
# The same commands run-hw.sh sends before every test (hw.sh: UOS_HW_PRELOAD).
# The "Invalid ACK (0) in DAP response" errors at the end are expected: the
# chip resets while the probe is still talking to it.
#
# The watchdog is written at its NORMAL address, not with `mww phys`: when a
# test left the MMU and D-cache on, a physical access makes OpenOCD clean the
# whole L1/L2 by set/way over JTAG first (minutes at CMSIS-DAP speed), and
# the reset never happens. Tests map 0xFC000000.. 1:1 as Device memory, and
# with the MMU off (firmware) virtual == physical anyway.

targets bcm2711.cpu0; catch {halt 1000}
if {[catch {mww 0xfe100024 0x5a000001}]} {
	catch {mww phys 0xfe100024 0x5a000001}
}
catch {mww 0xfe10001c 0x5a000020}
shutdown
